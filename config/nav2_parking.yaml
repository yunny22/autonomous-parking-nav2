amcl:
  ros__parameters:
    use_sim_time: false
    base_frame_id: base_footprint
    global_frame_id: map
    odom_frame_id: slam_odom
    scan_topic: /slam/scan_filtered
    map_topic: map
    robot_model_type: nav2_amcl::DifferentialMotionModel
    laser_model_type: likelihood_field
    laser_min_range: 0.10
    laser_max_range: 8.0
    max_beams: 120
    min_particles: 200
    max_particles: 1000
    update_min_d: 0.0
    update_min_a: 0.0
    transform_tolerance: 0.2
    tf_broadcast: true
    set_initial_pose: true
    initial_pose:
      x: -1.5
      y: -1.5
      z: 0.0
      yaw: 0.0

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /slam/odom
    bt_loop_duration: 10
    default_server_timeout: 20
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_recovery_node_bt_node
      - nav2_clear_costmap_service_bt_node

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [parking_goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.10
      movement_time_allowance: 10.0
    parking_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.20
    FollowPath:
      plugin: nav2_mppi_controller::MPPIController
      motion_model: Ackermann
      time_steps: 32
      model_dt: 0.05
      batch_size: 1000
      iteration_count: 1
      vx_max: 0.30
      vx_min: -0.30
      vy_max: 0.0
      wz_max: 0.8
      visualize: false
      enforce_path_inversion: true
      transform_tolerance: 0.2
      AckermannConstraints:
        min_turning_r: 0.50
      critics: [ConstraintCritic, CostCritic, GoalCritic, PathAlignCritic, PathFollowCritic]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        critical_cost: 300.0
        collision_cost: 1000000.0
        consider_footprint: true
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.50
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0
        threshold_to_consider: 0.50
        trajectory_point_step: 3
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.50

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 2.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_smac_planner/SmacPlannerHybrid
      tolerance: 0.25
      downsample_costmap: false
      allow_unknown: false
      max_iterations: 100000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      motion_model_for_search: REEDS_SHEPP
      angle_quantization_bins: 72
      minimum_turning_radius: 0.50
      reverse_penalty: 2.0
      change_penalty: 2.0
      non_straight_penalty: 1.2
      cost_penalty: 2.0
      retrospective_penalty: 0.015
      lookup_table_size: 20.0
      cache_obstacle_heuristic: false
      smooth_path: true

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: slam_odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      footprint: "[[-0.40, -0.25], [0.40, -0.25], [0.40, 0.25], [-0.40, 0.25]]"
      footprint_padding: 0.05
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /slam/scan_filtered
          data_type: LaserScan
          clearing: true
          marking: true
          obstacle_min_range: 0.10
          obstacle_max_range: 8.0
          raytrace_min_range: 0.10
          raytrace_max_range: 8.0
          max_obstacle_height: 1.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.30

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      resolution: 0.05
      track_unknown_space: true
      footprint: "[[-0.40, -0.25], [0.40, -0.25], [0.40, 0.25], [-0.40, 0.25]]"
      footprint_padding: 0.05
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /slam/scan_filtered
          data_type: LaserScan
          clearing: true
          marking: true
          obstacle_min_range: 0.10
          obstacle_max_range: 8.0
          raytrace_min_range: 0.10
          raytrace_max_range: 8.0
          max_obstacle_height: 1.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.30

map_server:
  ros__parameters:
    use_sim_time: false

map_saver:
  ros__parameters:
    use_sim_time: false

lifecycle_manager:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names: [map_server, amcl, planner_server, controller_server, bt_navigator]
